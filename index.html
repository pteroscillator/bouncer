<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Balls bounce in a box and every hit on the floor, the walls or another ball makes a sound, with controls for gravity, volume and the number of balls.">
    <title>Bouncer</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="matter.min.js"></script>
    <style>
        /* ---------- pteroscillator shared standard ---------- */
        :root {
            --bg: #000;
            --surface: #0a0a0a;
            --surface-2: #141414;
            --line: #1a1a1a;
            --border: #4d4d4d;
            --border-hover: #999;
            --text-dim: #808080;
            --text-mid: #ccc;
            --text: #fff;
            --hover-bg: #0d0d0d;
            --active-bg: #1a1a1a;
            --danger-bg: #1a0000;
            --danger-border: #800000;
            --danger-text: #ff6666;
            --danger-hover-bg: #330000;
            --danger-hover-border: #cc0000;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            --edge: 40px;
            --header-h: 116px;
            --panel-top: 84px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        button, input, select, a {
            font-family: inherit;
        }

        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 1px solid var(--text) !important;
            outline-offset: 2px;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: calc(var(--edge) + env(safe-area-inset-top, 0px)) calc(var(--edge) + env(safe-area-inset-right, 0px)) 0 calc(var(--edge) + env(safe-area-inset-left, 0px));
            pointer-events: none;
        }

        .header > * {
            pointer-events: auto;
        }

        .header.solid {
            background: var(--bg);
            padding-bottom: 16px;
        }

        .page-title {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .menu-btn {
            display: block;
            background: none;
            border: none;
            padding: 8px;
            margin: -8px;
            color: var(--border-hover);
            cursor: pointer;
            line-height: 0;
            transition: color 0.3s;
        }

        .menu-btn:hover,
        .menu-btn[aria-expanded="true"] {
            color: var(--text);
            background: none;
        }

        .menu-btn svg {
            display: block;
        }

        .panel {
            position: fixed;
            z-index: 101; /* above the header bar */
            top: calc(var(--panel-top) + env(safe-area-inset-top, 0px));
            right: calc(var(--edge) + env(safe-area-inset-right, 0px));
            width: 220px;
            max-height: calc(100vh - var(--panel-top) - var(--edge));
            max-height: calc(100dvh - var(--panel-top) - var(--edge) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--line);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel[hidden] {
            display: none;
        }

        .panel::-webkit-scrollbar {
            width: 4px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .qr {
            display: block;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .btn,
        .btn-start,
        .btn-small {
            display: inline-block;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn {
            padding: 8px 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .btn-start {
            background: var(--bg); /* stays readable over a canvas */
            width: 104px;
            height: 36px;
            padding: 0;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .btn:hover,
        .btn-start:hover,
        .btn-small:hover {
            border-color: var(--border-hover);
            background: var(--hover-bg);
        }

        .btn.active,
        .btn-start.active,
        .btn-small.active {
            border-color: var(--text);
            background: var(--active-bg);
        }

        .btn.danger {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
        }

        .btn.danger:hover {
            background: var(--danger-hover-bg);
            border-color: var(--danger-hover-border);
        }

        .panel .btn {
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 28px; /* hit area */
            margin: 0;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 1px;
            background: var(--border);
        }

        input[type="range"]::-moz-range-track {
            height: 1px;
            background: var(--border);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 17px;
            height: 17px;
            margin-top: -8px; /* (1 - 17) / 2 */
            border: none;
            border-radius: 50%;
            background: var(--text);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-moz-range-thumb {
            width: 17px;
            height: 17px;
            border: none;
            border-radius: 50%;
            background: var(--text);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }

        .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 11px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .control-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        @media (max-width: 768px) {
            :root {
                --edge: 16px;
                --header-h: 56px;
                --panel-top: 64px;
            }

            .header {
                padding-top: calc(10px + env(safe-area-inset-top, 0px));
            }

            .header.solid {
                padding-bottom: 10px;
            }

            .panel {
                left: calc(var(--edge) + env(safe-area-inset-left, 0px));
                width: auto;
            }

            input[type="range"] {
                height: 44px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 25px;
                height: 25px;
                margin-top: -12px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 25px;
                height: 25px;
            }

            .btn {
                min-height: 40px;
            }

            .btn-small {
                min-width: 36px;
                min-height: 36px;
            }
        }
        /* ---------- end of shared standard ---------- */

        body {
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* below the solid header: edge 40 + Start 36 + 16 */
        .container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            padding-top: 92px;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #canvas {
            border: 1px solid var(--line);
            background: var(--surface);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .controls-container {
            width: 400px;
            background: var(--surface);
            border-left: 1px solid var(--line);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .global-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control {
            display: flex;
            flex-direction: column;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .button-row .btn {
            flex: 1;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .separator {
            height: 1px;
            background: var(--line);
        }
    </style>
</head>
<body>
    <header class="header solid">
        <div class="page-title">Bouncer</div>
        <div class="header-actions">
            <button class="btn-start" id="toggle">Start</button>
            <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="panel"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="currentColor"/><rect x="11" y="12.5" width="18" height="3" fill="#000"/><rect x="11" y="18.5" width="18" height="3" fill="#000"/><rect x="11" y="24.5" width="18" height="3" fill="#000"/></svg></button>
        </div>
    </header>

    <div class="panel" id="panel" hidden>
        <img src="pteroscillator-QRcode.svg" class="qr" width="160" height="160" alt="QR code to pteroscillator.github.io">
        <a class="btn exit-link" href="https://pteroscillator.github.io/">Exit</a>
    </div>

    <div class="container">
        <!-- Left side: Canvas -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Right side: Controls -->
        <div class="controls-container">
            <div class="global-controls">
                <div class="control">
                    <div class="control-head"><span class="label">Volume</span><span class="value" id="volume-value">5</span></div>
                    <input type="range" id="volume-slider" min="0" max="10" value="5">
                </div>

                <div class="separator"></div>

                <div class="control">
                    <div class="control-head"><span class="label">Balls</span><span class="value" id="ball-count">5</span></div>
                    <div class="button-row">
                        <button class="btn" id="add-ball-btn">+ Add Ball</button>
                        <button class="btn" id="remove-ball-btn">- Remove Ball</button>
                    </div>
                </div>

                <div class="control">
                    <div class="control-head"><span class="label">Gravity</span><span class="value" id="gravity-value">10</span></div>
                    <input type="range" id="gravity-slider" min="0" max="100" value="10">
                </div>

                <div class="button-stack">
                    <button class="btn active" id="auto-replace-btn">Auto Replace: On</button>
                    <button class="btn" id="reset-btn">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Matter.js setup
        const { Engine, Render, Runner, Bodies, World, Body } = Matter;

        // Create engine with improved collision detection
        const engine = Engine.create({
            enableSleeping: false,
            constraintIterations: 4,
            positionIterations: 8,
            velocityIterations: 6
        });
        const world = engine.world;

        // Canvas setup - make it as large as possible
        const canvas = document.getElementById('canvas');
        const container = document.querySelector('.canvas-container');

        // Calculate maximum square size that fits in the container
        function calculateCanvasSize() {
            const containerWidth = container.clientWidth - 40; // Account for padding
            const containerHeight = container.clientHeight - 40;
            return Math.min(containerWidth, containerHeight);
        }

        let canvasSize = calculateCanvasSize();
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        const render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: canvasSize,
                height: canvasSize,
                wireframes: false,
                background: '#0a0a0a'
            }
        });

        // Create walls
        const wallThickness = 50;
        const bottomWall = Bodies.rectangle(canvasSize / 2, canvasSize + wallThickness / 2, canvasSize, wallThickness, {
            isStatic: true,
            restitution: 0.95,
            friction: 0,
            render: { fillStyle: '#1a1a1a' }
        });

        const topWall = Bodies.rectangle(canvasSize / 2, -wallThickness / 2, canvasSize, wallThickness, {
            isStatic: true,
            restitution: 0.95,
            friction: 0,
            render: { fillStyle: '#1a1a1a' }
        });

        const leftWall = Bodies.rectangle(-wallThickness / 2, canvasSize / 2, wallThickness, canvasSize, {
            isStatic: true,
            restitution: 0.95,
            friction: 0,
            render: { fillStyle: '#1a1a1a' }
        });

        const rightWall = Bodies.rectangle(canvasSize + wallThickness / 2, canvasSize / 2, wallThickness, canvasSize, {
            isStatic: true,
            restitution: 0.95,
            friction: 0,
            render: { fillStyle: '#1a1a1a' }
        });

        const walls = [topWall, bottomWall, leftWall, rightWall];
        World.add(world, walls);

        // Web Audio API setup
        let audioContext = null;
        let masterGain = null;
        let isMuted = true;  // Start muted
        let volumeLevel = 0.5; // 0-1 scale (slider is 0-10, so 5/10 = 0.5)
        let ballSoundFreq = 2100; // Ball collision sound frequency

        // Fade time constants (setTargetAtTime), shared by all pteroscillator apps
        const FADE_IN = 0.02;
        const FADE_OUT = 0.03;
        const SMOOTH = 0.015;

        // Initialize audio context on first user interaction
        function initAudio() {
            if (!audioContext) {
                // iOS: play through the silent switch (Safari 16.4+)
                try {
                    if (navigator.audioSession) navigator.audioSession.type = 'playback';
                } catch (e) {}
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.connect(audioContext.destination);
                masterGain.gain.value = 0; // silent until Start

                // Resume context if it's suspended (browser autoplay policy)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }
        }

        // Play floor collision sound
        function playFloorSound(velocity) {
            if (!audioContext || isMuted) return;

            const now = audioContext.currentTime;
            const baseFreq = 50; // 50Hz fundamental

            // Calculate base volume based on velocity (normalize to 0-1)
            // Max velocity is around 25, so scale accordingly
            const impactVolume = Math.min(Math.abs(velocity) / 25, 1);

            // Harmonics with their relative volumes (normalized to percentage of fundamental)
            const harmonics = [
                { freq: baseFreq * 1, volume: 20 },  // Fundamental
                { freq: baseFreq * 2, volume: 9 },   // 2nd harmonic
                { freq: baseFreq * 3, volume: 4 },   // 3rd harmonic
                { freq: baseFreq * 4, volume: 3 }    // 4th harmonic
            ];

            // Total volume for normalization
            const totalVolume = harmonics.reduce((sum, h) => sum + h.volume, 0);

            // Create oscillators and gains for each harmonic
            harmonics.forEach(harmonic => {
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = harmonic.freq;

                const gain = audioContext.createGain();

                // Normalize harmonic volume relative to total, then scale by impact
                const normalizedVolume = (harmonic.volume / totalVolume) * impactVolume;

                // Envelope: quick fade-in (0.01s), sustain (0.39s), exponential fade-out (0.1s)
                gain.gain.value = 0;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(normalizedVolume, now + 0.01);
                gain.gain.setValueAtTime(normalizedVolume, now + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                // Connect: osc -> gain -> masterGain -> destination
                osc.connect(gain);
                gain.connect(masterGain);

                // Start and stop
                osc.start(now);
                osc.stop(now + 0.5);
            });
        }

        // Play wall collision sound (left/right walls with stereo panning)
        function playWallSound(velocity, panValue) {
            if (!audioContext || isMuted) return;

            const now = audioContext.currentTime;
            const baseFreq = 75; // 75Hz (fifth of floor tone 50Hz)

            // Calculate base volume based on velocity, reduced to 80%
            const impactVolume = Math.min(Math.abs(velocity) / 25, 1) * 0.8;

            // Harmonics with their relative volumes
            const harmonics = [
                { freq: baseFreq * 1, volume: 27 },  // Fundamental
                { freq: baseFreq * 2, volume: 14 },  // 2nd harmonic
                { freq: baseFreq * 3, volume: 7 },   // 3rd harmonic
                { freq: baseFreq * 4, volume: 4 }    // 4th harmonic
            ];

            // Total volume for normalization
            const totalVolume = harmonics.reduce((sum, h) => sum + h.volume, 0);

            // Create stereo panner
            const panner = audioContext.createStereoPanner();
            panner.pan.value = panValue; // -1 for left, +1 for right

            // Create oscillators and gains for each harmonic
            harmonics.forEach(harmonic => {
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = harmonic.freq;

                const gain = audioContext.createGain();

                // Normalize harmonic volume relative to total, then scale by impact
                const normalizedVolume = (harmonic.volume / totalVolume) * impactVolume;

                // Envelope: quick fade-in (0.01s), sustain (0.29s), exponential fade-out (0.1s)
                // Total duration: 0.4s
                gain.gain.value = 0;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(normalizedVolume, now + 0.01);
                gain.gain.setValueAtTime(normalizedVolume, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                // Connect: osc -> gain -> panner -> masterGain -> destination
                osc.connect(gain);
                gain.connect(panner);

                // Start and stop
                osc.start(now);
                osc.stop(now + 0.4);
            });

            // Connect panner to master gain
            panner.connect(masterGain);
        }

        // Play ball collision sound with stereo panning
        function playBallSound(velocity, collisionX) {
            if (!audioContext || isMuted) return;

            const now = audioContext.currentTime;

            // Calculate pan based on collision X position
            // Left edge (0) = -1, Center (canvasSize/2) = 0, Right edge (canvasSize) = +1
            const panValue = (collisionX / canvasSize) * 2 - 1;

            // Create stereo panner
            const panner = audioContext.createStereoPanner();
            panner.pan.value = panValue;

            // Create oscillator with adjustable frequency
            const osc = audioContext.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = ballSoundFreq;

            // Create gain node for envelope
            const gain = audioContext.createGain();

            // Calculate volume based on velocity, capped at 15% of master (lower volume)
            const impactVolume = Math.min(Math.abs(velocity) / 25, 1) * 0.15;

            // Very short sound with exponential fade
            gain.gain.value = impactVolume;
            gain.gain.setValueAtTime(impactVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            // Connect: osc -> gain -> panner -> masterGain -> destination
            osc.connect(gain);
            gain.connect(panner);
            panner.connect(masterGain);

            // Start and stop
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // Helper function to create a ball with random position and velocity
        function createBall() {
            const radius = 10;
            const randomX = radius + Math.random() * (canvasSize - radius * 2);
            const randomY = radius + Math.random() * (canvasSize - radius * 2);

            // Generate random velocity with minimum speed of 5, maximum 25
            let randomVelX = (Math.random() - 0.5) * 50;
            let randomVelY = (Math.random() - 0.5) * 50;
            let speed = Math.sqrt(randomVelX ** 2 + randomVelY ** 2);

            // Ensure minimum speed of 5
            if (speed < 5) {
                const scale = 5 / speed;
                randomVelX *= scale;
                randomVelY *= scale;
            }

            // Cap maximum speed at 25
            if (speed > 25) {
                const scale = 25 / speed;
                randomVelX *= scale;
                randomVelY *= scale;
            }

            const ball = Bodies.circle(randomX, randomY, radius, {
                restitution: 0.95,
                friction: 0,
                frictionAir: 0,
                density: 0.001,
                slop: 0.1,
                inertia: Infinity,  // Prevents rotation
                render: {
                    fillStyle: '#fff'
                }
            });

            Body.setVelocity(ball, { x: randomVelX, y: randomVelY });
            return ball;
        }

        // Helper function to create a slow ball in lower quarter
        function createSlowBallInLowerQuarter() {
            const radius = 10;
            // Position in lower quarter (bottom 25% of canvas)
            const randomX = radius + Math.random() * (canvasSize - radius * 2);
            const lowerQuarterY = canvasSize * 0.75 + Math.random() * (canvasSize * 0.25 - radius * 2);

            // Low speed: between 1 and 3
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 2;
            const randomVelX = Math.cos(angle) * speed;
            const randomVelY = Math.sin(angle) * speed;

            const ball = Bodies.circle(randomX, lowerQuarterY, radius, {
                restitution: 0.95,
                friction: 0,
                frictionAir: 0,
                density: 0.001,
                slop: 0.1,
                inertia: Infinity,
                render: {
                    fillStyle: '#fff'
                }
            });

            Body.setVelocity(ball, { x: randomVelX, y: randomVelY });
            return ball;
        }

        // Create five balls, with one slow ball in lower quarter
        const balls = [
            createSlowBallInLowerQuarter(),  // First ball: slow, in lower quarter
            createBall(),
            createBall(),
            createBall(),
            createBall()
        ];

        World.add(world, balls);

        // Start engine and renderer
        Render.run(render);
        const runner = Runner.create({
            delta: 1000 / 60,
            isFixed: true  // Fixed timestep prevents tunneling at high speeds
        });
        Runner.run(runner, engine);

        // Collision event handling
        Matter.Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;

                // Check if bodies are balls (has circleRadius) and NOT static
                const isBallA = bodyA.circleRadius !== undefined && !bodyA.isStatic;
                const isBallB = bodyB.circleRadius !== undefined && !bodyB.isStatic;

                if (isBallA && isBallB) {
                    // Ball-to-ball collision only (both are dynamic balls)
                    const velocity = Math.abs(bodyA.velocity.y) + Math.abs(bodyB.velocity.y);
                    // Calculate collision X position (average of the two ball positions)
                    const collisionX = (bodyA.position.x + bodyB.position.x) / 2;
                    playBallSound(velocity, collisionX);
                } else if (isBallA && bodyB.isStatic) {
                    // Ball A hit a wall
                    if (bodyB === bottomWall) {
                        const velocity = Math.abs(bodyA.velocity.y);
                        playFloorSound(velocity);
                    } else if (bodyB === leftWall) {
                        const velocity = Math.abs(bodyA.velocity.x);
                        playWallSound(velocity, -1); // Pan left
                    } else if (bodyB === rightWall) {
                        const velocity = Math.abs(bodyA.velocity.x);
                        playWallSound(velocity, 1); // Pan right
                    }
                } else if (isBallB && bodyA.isStatic) {
                    // Ball B hit a wall
                    if (bodyA === bottomWall) {
                        const velocity = Math.abs(bodyB.velocity.y);
                        playFloorSound(velocity);
                    } else if (bodyA === leftWall) {
                        const velocity = Math.abs(bodyB.velocity.x);
                        playWallSound(velocity, -1); // Pan left
                    } else if (bodyA === rightWall) {
                        const velocity = Math.abs(bodyB.velocity.x);
                        playWallSound(velocity, 1); // Pan right
                    }
                }
            });
        });

        // Animation state
        let autoReplace = true;  // Start with auto-replace ON
        const restTime = 2000; // Time in ms a ball must be at rest before being replaced
        let ballRestTimers = []; // Track how long each ball has been at rest (dynamically sized)

        // Initialize ball rest timers
        ballRestTimers = balls.map(() => 0);

        // Update ball physics and auto-replace logic
        function updateBalls() {
            const now = Date.now();

            balls.forEach((ball, index) => {
                if (!ball) return;

                const speed = Math.sqrt(ball.velocity.x ** 2 + ball.velocity.y ** 2);

                // Cap speed at 25
                if (speed > 25) {
                    const scale = 25 / speed;
                    Body.setVelocity(ball, {
                        x: ball.velocity.x * scale,
                        y: ball.velocity.y * scale
                    });
                }

                // At zero gravity, prevent balls from stopping completely
                if (world.gravity.y === 0 && speed > 0 && speed < 0.5) {
                    const scale = 0.5 / speed;
                    Body.setVelocity(ball, {
                        x: ball.velocity.x * scale,
                        y: ball.velocity.y * scale
                    });
                }

                // Apply horizontal damping when ball is settled on the floor
                if (world.gravity.y > 0) {
                    const isNearFloor = ball.position.y > canvasSize - ball.circleRadius - 5;
                    const verticalSpeed = Math.abs(ball.velocity.y);
                    const horizontalSpeed = Math.abs(ball.velocity.x);

                    // If ball is on the floor with minimal vertical movement, apply damping
                    if (isNearFloor && verticalSpeed < 2) {
                        // Damping factor: stronger damping as vertical speed decreases
                        const dampingFactor = 0.95 - (verticalSpeed / 2) * 0.1; // 0.95 to 0.85
                        Body.setVelocity(ball, {
                            x: ball.velocity.x * dampingFactor,
                            y: ball.velocity.y
                        });

                        // Stop completely if horizontal speed is very low
                        if (horizontalSpeed < 0.1) {
                            Body.setVelocity(ball, {
                                x: 0,
                                y: ball.velocity.y
                            });
                        }
                    }
                }

                // Check if ball is at rest (only when gravity > 0 and auto-replace is ON)
                // Ball is considered at rest if: speed is low AND horizontal velocity is very small AND it's near the floor
                const isNearFloor = ball.position.y > canvasSize - ball.circleRadius - 60; // Within 60px of bottom
                const horizontalSpeed = Math.abs(ball.velocity.x);

                if (autoReplace && world.gravity.y > 0 && speed < 2 && horizontalSpeed < 0.5 && isNearFloor) {
                    if (ballRestTimers[index] === 0) {
                        ballRestTimers[index] = now;
                    } else if (now - ballRestTimers[index] > restTime) {
                        // Ball has been at rest for long enough - replace it
                        World.remove(world, ball);
                        const newBall = createBall();
                        balls[index] = newBall;
                        World.add(world, newBall);
                        ballRestTimers[index] = 0;
                    }
                } else {
                    ballRestTimers[index] = 0; // Reset timer if ball is moving
                }
            });

            requestAnimationFrame(updateBalls);
        }

        // Update ball count display
        function updateBallCount() {
            document.getElementById('ball-count').textContent = balls.length;
        }

        // Start physics updates
        updateBalls();
        updateBallCount();

        // Add ball button
        document.getElementById('add-ball-btn').addEventListener('click', () => {
            const newBall = createBall();
            balls.push(newBall);
            ballRestTimers.push(0);
            World.add(world, newBall);
            updateBallCount();
        });

        // Remove ball button
        document.getElementById('remove-ball-btn').addEventListener('click', () => {
            if (balls.length > 0) {
                const removedBall = balls.pop();
                ballRestTimers.pop();
                World.remove(world, removedBall);
                updateBallCount();
            }
        });

        // Gravity slider
        document.getElementById('gravity-slider').addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            document.getElementById('gravity-value').textContent = value;
            // 0 = 0, 50 = moderate gravity, 100 = black hole (very strong)
            // Use exponential curve for dramatic effect at 100%
            world.gravity.y = Math.pow(value / 100, 2) * 50;
        });

        // Reset button
        document.getElementById('reset-btn').addEventListener('click', () => {
            // Remove all balls
            World.remove(world, balls);

            // Create new balls (keep same count)
            const ballCount = balls.length || 5;
            balls.length = 0;
            ballRestTimers.length = 0;

            // First ball: slow, in lower quarter
            balls.push(createSlowBallInLowerQuarter());
            ballRestTimers.push(0);

            // Remaining balls: random
            for (let i = 1; i < ballCount; i++) {
                balls.push(createBall());
                ballRestTimers.push(0);
            }

            World.add(world, balls);
            updateBallCount();
        });

        // Auto-replace toggle
        document.getElementById('auto-replace-btn').addEventListener('click', () => {
            autoReplace = !autoReplace;
            const btn = document.getElementById('auto-replace-btn');
            btn.textContent = `Auto Replace: ${autoReplace ? 'On' : 'Off'}`;
            if (autoReplace) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            // Reset all timers when toggling
            ballRestTimers.fill(0);
        });

        // Start / Stop: the sound only, the balls keep moving
        function toggleSound() {
            const btn = document.getElementById('toggle');
            initAudio();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            isMuted = !isMuted;
            const now = audioContext.currentTime;
            masterGain.gain.cancelScheduledValues(now);
            if (isMuted) {
                masterGain.gain.setTargetAtTime(0, now, FADE_OUT);
                btn.textContent = 'Start';
                btn.classList.remove('active');
            } else {
                masterGain.gain.setTargetAtTime(volumeLevel, now, FADE_IN);
                btn.textContent = 'Stop';
                btn.classList.add('active');
            }
        }

        document.getElementById('toggle').addEventListener('click', toggleSound);

        // Volume slider
        document.getElementById('volume-slider').addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            volumeLevel = value / 10; // Convert 0-10 to 0-1
            document.getElementById('volume-value').textContent = value;
            if (masterGain && !isMuted) {
                masterGain.gain.setTargetAtTime(volumeLevel, audioContext.currentTime, SMOOTH);
            }
        });

        // Spacebar: Start / Stop the sound, once per press. R: new balls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (e.repeat) return;
                toggleSound();
            } else if (e.code === 'KeyR' && !e.repeat && !e.metaKey && !e.ctrlKey && !e.altKey) {
                document.getElementById('reset-btn').click();
            }
        });

        // Stop a focused button from also firing its own click on key release
        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') e.preventDefault();
        });

        // Menu panel: icon toggles, click outside or Escape closes
        const menuBtn = document.getElementById('menuBtn');
        const panel = document.getElementById('panel');

        function setPanel(open) {
            panel.hidden = !open;
            menuBtn.setAttribute('aria-expanded', String(open));
        }

        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            setPanel(panel.hidden);
        });

        document.addEventListener('click', function(e) {
            if (!panel.hidden && !panel.contains(e.target)) setPanel(false);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !panel.hidden) setPanel(false);
        });

        // Initialize gravity to 10
        world.gravity.y = Math.pow(10 / 100, 2) * 50;

        // Resize canvas when window resizes
        window.addEventListener('resize', () => {
            const newSize = calculateCanvasSize();
            if (newSize !== canvasSize) {
                canvasSize = newSize;
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                render.canvas.width = canvasSize;
                render.canvas.height = canvasSize;
                render.options.width = canvasSize;
                render.options.height = canvasSize;
            }
        });
    </script>

</body>
</html>
